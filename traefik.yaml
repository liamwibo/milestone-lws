apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik-controller
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik-controller
      containers:
        - name: traefik
          image: traefik:v3.7
          args:
            - --providers.kubernetesgateway=true
            - --entrypoints.web.address=:8000
          ports:
            - containerPort: 8000
              name: web
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
spec:
  type: ClusterIP
  selector:
    app: traefik
  ports:
    - name: web
      port: 80
      targetPort: 8000
