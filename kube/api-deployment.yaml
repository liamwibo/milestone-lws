apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: default
spec:
  selector:
    matchLabels:
      app: api
  replicas: 1
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: fastapi
          image: milestone-api
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
