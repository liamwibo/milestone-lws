apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: default
spec:
  selector:
    matchLabels:
      app: frontend
  replicas: 1
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: lighttp
          image: milestone-web
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http